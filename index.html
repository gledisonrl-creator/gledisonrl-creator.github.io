<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a1513">
<title>Subseção de Investigação Criminal Militar</title>
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif}
  body{background:#091310;color:#f5f5ef}
  main{position:relative;isolation:isolate;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 22px;overflow:hidden}
  main::before{content:"";position:absolute;inset:0;z-index:-2;background:radial-gradient(circle at 50% 46%,#1d3028 0%,#0a1613 55%,#050b09 100%)}
  main::after{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(circle at center,rgba(20,47,37,.35),transparent 75%)}
  .crest{width:clamp(130px,30vw,190px);height:auto;display:block;margin:0 auto 25px;filter:drop-shadow(0 6px 18px rgba(0,0,0,.42))}
  .line{width:55px;height:2px;background:#c8b077;margin:0 auto 30px}
  h1{font-size:clamp(37px,8vw,72px);letter-spacing:.16em;margin:0 0 26px;font-weight:750}
  .function{font-size:clamp(17px,3.6vw,30px);font-weight:700;line-height:1.38;letter-spacing:.075em;max-width:830px;margin:0 0 35px;text-wrap:balance}
  .institution{font-size:clamp(15px,2.8vw,23px);letter-spacing:.18em;line-height:1.8;font-weight:600;margin:0}
  .institution span{display:block}
  .contact{display:inline-flex;align-items:center;justify-content:center;gap:10px;margin-top:31px;padding:13px 22px;border:1px solid #c8b077;border-radius:999px;color:#f5f5ef;text-decoration:none;font-size:clamp(16px,3.5vw,21px);font-weight:700;letter-spacing:.03em;background:rgba(5,12,9,.45)}
  .contact:hover,.contact:focus-visible{background:rgba(200,176,119,.18);outline-offset:4px}
  .contact small{font-size:12px;font-weight:400;color:#e0d3b4}
  .bottom{margin-top:35px;width:55px;height:2px;background:#c8b077}
  @media(max-width:480px){h1{letter-spacing:.11em}.institution{letter-spacing:.12em}}
</style>
</head>
<body><main>
  <img class="crest" src="brasao-corregedoria.png" alt="Brasão da Corregedoria-Geral da Brigada Militar">
  <div class="line" aria-hidden="true"></div>
  <h1>CAPITÃO</h1>
  <p class="function">CHEFE DA SUBSEÇÃO DE<br> INVESTIGAÇÃO CRIMINAL MILITAR</p>
  <p class="institution"><span>CORREGEDORIA GERAL</span><span>BRIGADA MILITAR</span></p>
  <a class="contact" href="https://wa.me/5551984376922" aria-label="Conversar pelo WhatsApp funcional: (51) 98437-6922">WhatsApp · (51) 98437-6922</a>
  <a class="Contato" href="mailto:cor-ssic@bm.rs.gov.br" style="display:inline-flex;align-items:center;justify-content:center;margin-top:10px;padding:13px 22px;border:1px solid #c8b077;border-radius:999px;color:#f5f5ef;text-decoration:none;font-weight:750;">E-mail · cor-ssic@bm.rs.gov.br</a>
  <div class="bottom" aria-hidden="true"></div>
</main></body>
</html>
